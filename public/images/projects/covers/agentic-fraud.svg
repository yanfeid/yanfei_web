<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">
  <defs>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="1.2" cy="1.2" r="1.2" fill="#2a2a26"/>
    </pattern>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6f6f66"/>
    </marker>
  </defs>
  <rect width="1600" height="1000" fill="#141412"/>
  <rect width="1600" height="1000" fill="url(#dots)"/>

  <text x="120" y="130" font-size="26" fill="#9ece6a">// agentic fraud analysis</text>
  <text x="120" y="180" font-size="20" fill="#6f6f66">planning agent orchestrates sub-agents via MCP tool calls</text>

  <!-- alerts -->
  <g transform="translate(120,320)">
    <rect width="260" height="120" rx="10" fill="#1b1b18" stroke="#3a3a35" stroke-width="2"/>
    <text x="130" y="55" font-size="24" fill="#d8d5ca" text-anchor="middle">ALERTS</text>
    <text x="130" y="90" font-size="17" fill="#6f6f66" text-anchor="middle">monitoring feeds</text>
  </g>

  <!-- planner -->
  <g transform="translate(500,290)">
    <rect width="300" height="180" rx="10" fill="#1b1b18" stroke="#9ece6a" stroke-width="2.5"/>
    <text x="150" y="70" font-size="24" fill="#9ece6a" text-anchor="middle">PLANNING</text>
    <text x="150" y="104" font-size="24" fill="#9ece6a" text-anchor="middle">AGENT</text>
    <text x="150" y="145" font-size="16" fill="#6f6f66" text-anchor="middle">RAG · case memory</text>
  </g>

  <!-- sub-agents -->
  <g transform="translate(940,180)">
    <rect width="280" height="110" rx="10" fill="#1b1b18" stroke="#3a3a35" stroke-width="2"/>
    <text x="140" y="48" font-size="21" fill="#d8d5ca" text-anchor="middle">TRIAGE AGENT</text>
    <text x="140" y="82" font-size="16" fill="#6f6f66" text-anchor="middle">consolidate → incident</text>
  </g>
  <g transform="translate(940,330)">
    <rect width="280" height="110" rx="10" fill="#1b1b18" stroke="#3a3a35" stroke-width="2"/>
    <text x="140" y="48" font-size="21" fill="#d8d5ca" text-anchor="middle">DIAGNOSE AGENT</text>
    <text x="140" y="82" font-size="16" fill="#6f6f66" text-anchor="middle">root-cause analysis</text>
  </g>
  <g transform="translate(940,480)">
    <rect width="280" height="110" rx="10" fill="#1b1b18" stroke="#3a3a35" stroke-width="2"/>
    <text x="140" y="48" font-size="21" fill="#d8d5ca" text-anchor="middle">MITIGATION AGENT</text>
    <text x="140" y="82" font-size="16" fill="#6f6f66" text-anchor="middle">plan &amp; deploy fix</text>
  </g>

  <!-- human approval -->
  <g transform="translate(1330,330)">
    <rect width="160" height="110" rx="10" fill="#1b1b18" stroke="#3a3a35" stroke-width="2" stroke-dasharray="7 6"/>
    <text x="80" y="48" font-size="19" fill="#d8d5ca" text-anchor="middle">HUMAN</text>
    <text x="80" y="80" font-size="19" fill="#d8d5ca" text-anchor="middle">REVIEW</text>
  </g>

  <!-- edges -->
  <line x1="380" y1="380" x2="492" y2="380" stroke="#6f6f66" stroke-width="2.5" marker-end="url(#arr)"/>
  <line x1="800" y1="345" x2="932" y2="245" stroke="#6f6f66" stroke-width="2.5" marker-end="url(#arr)"/>
  <line x1="800" y1="380" x2="932" y2="385" stroke="#6f6f66" stroke-width="2.5" marker-end="url(#arr)"/>
  <line x1="800" y1="415" x2="932" y2="525" stroke="#6f6f66" stroke-width="2.5" marker-end="url(#arr)"/>
  <line x1="1220" y1="385" x2="1322" y2="385" stroke="#6f6f66" stroke-width="2.5" marker-end="url(#arr)"/>

  <text x="850" y="640" font-size="18" fill="#9ece6a" text-anchor="middle">MCP TOOL CALLS</text>
  <path d="M 660 470 L 660 620 L 1080 620 L 1080 598" stroke="#3f4f35" stroke-width="2" fill="none" stroke-dasharray="6 6"/>

  <text x="120" y="880" font-size="22" fill="#6f6f66">first-pass case triage, automated · analyst review −30%</text>
  <text x="1480" y="880" font-size="20" fill="#5a5a52" text-anchor="end">PYTHON · MCP · LLM</text>
</svg>
