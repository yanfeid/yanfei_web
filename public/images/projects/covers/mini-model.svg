<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">
  <defs>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="1.2" cy="1.2" r="1.2" fill="#2a2a26"/>
    </pattern>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6f6f66"/>
    </marker>
  </defs>
  <rect width="1600" height="1000" fill="#141412"/>
  <rect width="1600" height="1000" fill="url(#dots)"/>

  <text x="120" y="130" font-size="26" fill="#9ece6a">// mini model — fraud diagnostics</text>
  <text x="120" y="180" font-size="20" fill="#6f6f66">which features drive the new fraud trend? ranked in hours, not days</text>

  <!-- pipeline -->
  <g transform="translate(120,300)">
    <rect width="250" height="110" rx="10" fill="#1b1b18" stroke="#3a3a35" stroke-width="2"/>
    <text x="125" y="50" font-size="20" fill="#d8d5ca" text-anchor="middle">TRANSACTIONS</text>
    <text x="125" y="84" font-size="16" fill="#6f6f66" text-anchor="middle">validated dataset</text>
  </g>
  <g transform="translate(450,300)">
    <rect width="250" height="110" rx="10" fill="#1b1b18" stroke="#3a3a35" stroke-width="2"/>
    <text x="125" y="50" font-size="20" fill="#d8d5ca" text-anchor="middle">ENRICH</text>
    <text x="125" y="84" font-size="16" fill="#6f6f66" text-anchor="middle">25,000+ features</text>
  </g>
  <g transform="translate(780,300)">
    <rect width="250" height="110" rx="10" fill="#1b1b18" stroke="#9ece6a" stroke-width="2.5"/>
    <text x="125" y="50" font-size="20" fill="#9ece6a" text-anchor="middle">IV + LightGBM</text>
    <text x="125" y="84" font-size="16" fill="#6f6f66" text-anchor="middle">distributed on Spark</text>
  </g>
  <line x1="370" y1="355" x2="442" y2="355" stroke="#6f6f66" stroke-width="2.5" marker-end="url(#arr)"/>
  <line x1="700" y1="355" x2="772" y2="355" stroke="#6f6f66" stroke-width="2.5" marker-end="url(#arr)"/>
  <line x1="1030" y1="355" x2="1102" y2="355" stroke="#6f6f66" stroke-width="2.5" marker-end="url(#arr)"/>

  <!-- feature importance bars -->
  <g transform="translate(1110,240)">
    <rect width="370" height="330" rx="10" fill="#1b1b18" stroke="#3a3a35" stroke-width="2"/>
    <text x="30" y="48" font-size="18" fill="#d8d5ca">TOP RISK DRIVERS</text>
    <g font-size="14" fill="#6f6f66">
      <text x="30" y="95">ip_velocity_24h</text>
      <rect x="30" y="105" width="290" height="14" fill="#9ece6a"/>
      <text x="30" y="150">device_reuse_ct</text>
      <rect x="30" y="160" width="235" height="14" fill="#7ba556"/>
      <text x="30" y="205">acct_age_days</text>
      <rect x="30" y="215" width="180" height="14" fill="#5f8046"/>
      <text x="30" y="260">geo_mismatch</text>
      <rect x="30" y="270" width="130" height="14" fill="#495f3a"/>
      <text x="30" y="305">amt_zscore</text>
      <rect x="30" y="315" width="85" height="14" fill="#39482f"/>
    </g>
  </g>

  <text x="120" y="620" font-size="20" fill="#6f6f66">$ minimodel run --trend novel_fraud_0425</text>
  <text x="120" y="662" font-size="20" fill="#9ece6a">&gt; report ready: 25,318 features scored · 3 days → 1 hour</text>

  <text x="120" y="880" font-size="22" fill="#6f6f66">dynamic Dataproc sizing · HTML report with visualizations</text>
  <text x="1480" y="880" font-size="20" fill="#5a5a52" text-anchor="end">BIGQUERY · DATAPROC · SPARK</text>
</svg>
