<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">
  <defs>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="1.2" cy="1.2" r="1.2" fill="#2a2a26"/>
    </pattern>
  </defs>
  <rect width="1600" height="1000" fill="#141412"/>
  <rect width="1600" height="1000" fill="url(#dots)"/>

  <text x="120" y="130" font-size="26" fill="#9ece6a">// inna t'union pier</text>
  <text x="120" y="180" font-size="20" fill="#6f6f66">a boutique hotel site, end to end: booking · gallery · admin</text>

  <!-- browser frame -->
  <g transform="translate(310,240)">
    <rect width="980" height="560" rx="14" fill="#1b1b18" stroke="#3a3a35" stroke-width="2"/>
    <rect width="980" height="56" rx="14" fill="#22221f"/>
    <circle cx="36" cy="28" r="7" fill="#3a3a35"/>
    <circle cx="62" cy="28" r="7" fill="#3a3a35"/>
    <circle cx="88" cy="28" r="7" fill="#3a3a35"/>
    <rect x="130" y="14" width="500" height="28" rx="14" fill="#141412"/>
    <text x="150" y="34" font-size="15" fill="#6f6f66">innatunionpier.com</text>

    <!-- hero wireframe -->
    <rect x="40" y="96" width="900" height="200" rx="8" fill="#22221f"/>
    <text x="490" y="185" font-size="26" fill="#d8d5ca" text-anchor="middle" font-family="Georgia, serif" font-style="italic">Inna T'Union Pier</text>
    <text x="490" y="222" font-size="15" fill="#6f6f66" text-anchor="middle">WATERFRONT ROOMS · CHARLESTON</text>

    <!-- room cards -->
    <g transform="translate(40,330)">
      <rect width="284" height="150" rx="8" fill="#22221f"/>
      <rect x="0" y="0" width="284" height="88" rx="8" fill="#2c2c28"/>
      <text x="18" y="118" font-size="15" fill="#d8d5ca">Harbor King</text>
      <text x="18" y="140" font-size="13" fill="#6f6f66">from $240 / night</text>
    </g>
    <g transform="translate(348,330)">
      <rect width="284" height="150" rx="8" fill="#22221f"/>
      <rect x="0" y="0" width="284" height="88" rx="8" fill="#2c2c28"/>
      <text x="18" y="118" font-size="15" fill="#d8d5ca">Pier Suite</text>
      <text x="18" y="140" font-size="13" fill="#6f6f66">from $320 / night</text>
    </g>
    <g transform="translate(656,330)">
      <rect width="284" height="150" rx="8" fill="#22221f"/>
      <rect x="0" y="0" width="284" height="88" rx="8" fill="#2c2c28"/>
      <text x="18" y="118" font-size="15" fill="#d8d5ca">Garden Double</text>
      <text x="18" y="140" font-size="13" fill="#6f6f66">from $180 / night</text>
    </g>

    <!-- booking bar -->
    <rect x="40" y="500" width="740" height="36" rx="8" fill="#141412" stroke="#2e2e2a"/>
    <text x="60" y="524" font-size="14" fill="#6f6f66">check-in · check-out · 2 guests</text>
    <rect x="796" y="500" width="144" height="36" rx="8" fill="#9ece6a"/>
    <text x="868" y="524" font-size="14" fill="#141412" text-anchor="middle">BOOK NOW</text>
  </g>

  <text x="120" y="880" font-size="22" fill="#6f6f66">booking calendar · lightbox gallery · admin dashboard · SSG/SSR</text>
  <text x="1480" y="880" font-size="20" fill="#5a5a52" text-anchor="end">NEXT.JS · POSTGRES</text>
</svg>
